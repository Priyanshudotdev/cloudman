name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/cloudman_ci
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdefghijklmnop
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4000
      CLOUDMAN_SECRET: ababababababababababababababababababababababababababababababab
      CLOUDMAN_WORKER_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run check-types
      - name: tests (core, repo, api e2e, worker mock)
        run: bunx turbo run test
      - name: web build
        run: bunx turbo run build --filter=web
      - name: lint (non-blocking until biome is clean)
        run: bunx biome check .
        continue-on-error: true
