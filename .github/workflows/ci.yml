name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/cloudman_ci
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdefghijklmnop
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Must be exactly 64 hex chars — packages/env validates it with /^[0-9a-fA-F]{64}$/
      CLOUDMAN_SECRET: abababababababababababababababababababababababababababababababab
      CLOUDMAN_WORKER_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run check-types
      - name: tests (core, repo, api e2e, worker mock)
        run: bunx turbo run test
      - name: web build
        # apps/web imports @my-better-t-app/auth (the /api/auth/[...all]
        # route), which validates env/server at build time. Mirror the
        # Dockerfile web stage: skip validation so the build needs no secrets.
        run: SKIP_ENV_VALIDATION=1 bunx turbo run build --filter=web
      - name: lint
        run: bunx biome check .
